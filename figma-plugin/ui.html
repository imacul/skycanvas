<!doctype html><meta charset="utf-8"><style>body{font:12px Inter,sans-serif;margin:16px;color:#222}button{width:100%;padding:10px;border:0;border-radius:8px;background:#665cf6;color:white;font-weight:600}p{color:#666;line-height:1.45}</style><button id="copy">Copy selection to SkyCanvas</button><p id="status">Select a frame, component, group, or object in Figma.</p><script>let payload=null;onmessage=e=>{if(e.data.pluginMessage?.type==="payload"){payload=e.data.pluginMessage.data;document.querySelector("#status").textContent="Ready — copy it, then paste in SkyCanvas."}};document.querySelector("#copy").onclick=async()=>{parent.postMessage({pluginMessage:{type:"export"}},"*")};onmessage=async e=>{const m=e.data.pluginMessage;if(m?.type==="payload"){payload=m.data;try{await navigator.clipboard.writeText(JSON.stringify(payload));document.querySelector("#status").textContent="Copied. Go to SkyCanvas and press Ctrl + V.";parent.postMessage({pluginMessage:{type:"copied"}},"*")}catch{document.querySelector("#status").textContent="Clipboard permission blocked. Click Copy again.";}}};</script>
